# TLS bridge for yi-hack cameras whose embedded CyaSSL 3.3.0 (2014) cannot validate
# the GlobalSign R46 chain Yi switched to on 2026-11-23 (no SHA-384, no 4096-bit RSA,
# no ECDHE). Cameras talk legacy TLS to this proxy; the proxy talks modern, fully
# verified TLS to the real Yi API.

worker_processes 1;
pid /tmp/nginx.pid;
# crit: nginx error lines include the full request URI, and the cameras put the
# device password and hmac in the query string. Failures stay visible as
# status 5xx in the JSON access log.
error_log /dev/stderr crit;

events {
    worker_connections 64;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;

    # Path only: query strings carry uid, hmac and device password.
    log_format audit escape=json
        '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"upstream_status":"$upstream_status",'
        '"request_time":$request_time,"tls":"$ssl_protocol","cipher":"$ssl_cipher"}';
    access_log /dev/stdout audit;

    # Docker embedded DNS; re-resolve so a changed Yi IP is picked up without restart.
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Reuse upstream TLS connections: fewer fresh handshakes to Yi, which
    # intermittently stall. 'resolve' (nginx >= 1.27.3) keeps re-resolving the name.
    upstream yi_api {
        zone yi_api 64k;
        server api.eu.xiaoyi.com:443 resolve;
        keepalive 4;
        keepalive_timeout 60s;
    }

    server {
        listen 8443 ssl;
        server_name api.eu.xiaoyi.com;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        # Only what CyaSSL 3.3.0 offers (RSA kex, AES, SHA-1/SHA-256).
        # SECLEVEL=0: CyaSSL may advertise only RSA+SHA1 handshake sigalgs, which
        # OpenSSL 3 rejects at level 1. Acceptable because this listener is
        # reachable only from the camera alias via NAT, never from LAN or WAN.
        ssl_protocols TLSv1.2;
        ssl_ciphers 'AES128-GCM-SHA256:AES128-SHA256:AES128-SHA:@SECLEVEL=0';
        ssl_prefer_server_ciphers on;
        ssl_session_cache off;

        client_max_body_size 1m;

        location / {
            proxy_pass https://yi_api;

            proxy_set_header Host api.eu.xiaoyi.com;
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name api.eu.xiaoyi.com;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_session_reuse on;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }

    # Container healthcheck only; bound to loopback.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz {
            return 200 "ok\n";
        }
    }
}
